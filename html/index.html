<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DelPerroSands Talk</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- DPS 2026-09-27: subtitle talk layer. No panel, no history box. -->
    <div id="talk" class="hidden">
        <div id="gesture" class="gesture hidden"></div>
        <div id="choices" class="choices">
            <button id="pay-btn" class="chip"><span class="k">$</span>Offer money</button>
            <button id="leave-btn" class="chip"><span class="k">Esc</span>Walk away</button>
        </div>
        <div class="stack">
            <div class="name"><span id="ring" class="ring"></span><span id="npc-name">NPC</span></div>
            <div id="line" class="line"></div>
            <div class="input">
                <span class="k">Enter</span>
                <input type="text" id="message-input" placeholder="Say something…" maxlength="200" autocomplete="off">
                <span class="k dim">Esc walks away</span>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
